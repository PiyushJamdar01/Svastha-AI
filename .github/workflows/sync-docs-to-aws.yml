
name: Sync Markdown Docs to S3

on:
  push:
    branches:
      - master
    paths:
      - '**/*.md'
      - '**/*.MD'
      - '.github/workflows/sync-markdown.yml'
      
permissions:
  contents: read

jobs:
  sync-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stage only Markdown files
        shell: bash
        run: |
          mkdir -p docs-export

          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              *.md|*.MD)
                mkdir -p "docs-export/$(dirname "$file")"
                cp "$file" "docs-export/$file"
                ;;
            esac
          done


      - name: Upload Markdown files to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 sync docs-export "s3://${S3_BUCKET}/source-docs/" \
            --delete \
            --only-show-errors


            
